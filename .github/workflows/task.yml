name: Task

on:
  workflow_dispatch:
    inputs:
      max_upload_num:
        required: true
        type: number
        default: 1000

jobs:
  task:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          repository: "${{ secrets.T1_REPO }}"
          ref: "${{ secrets.T1_REPO_REF }}"
          token: "${{ secrets.T1_REPO_TOKEN }}"
      - uses: oven-sh/setup-bun@v2
      - run: bun install && bun run index.ts
        env:
          ACCOUNT_ID: ${{ secrets.T1_ACCOUNT_ID }}
          PROJECT_NAME: ${{ secrets.T1_PROJECT_NAME }}
          PROJECT_TOKEN: ${{ secrets.T1_PROJECT_TOKEN }}
          MAX_UPLOAD_NUM: ${{ inputs.max_upload_num }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -m "Auto update - $(date -u '+%Y-%m-%d %H:%M:%S') UTC"
          git push origin main
